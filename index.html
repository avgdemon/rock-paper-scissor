<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rock · Paper · Scissors</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="reset.css">
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <main id="container">
    <header>
      <h1>Rock <span class="dot">·</span> Paper <span class="dot">·</span> Scissors</h1>
      <p class="tagline">A steam-powered bot has challenged you to a duel.<br>
        <u>Rock</u> beats <u>Scissors</u> · <u>Scissors</u> beats <u>Paper</u> · <u>Paper</u> beats <u>Rock</u>.</p>
    </header>

    <section class="scoreboard" aria-label="Scoreboard">
      <div class="score-card player">
        <div class="score" id="myScore">0</div>
        <p class="score-label">You</p>
      </div>
      <div class="vs">VS</div>
      <div class="score-card bot">
        <div class="score" id="botScore">0</div>
        <p class="score-label">Bot</p>
      </div>
    </section>

    <section class="arena" aria-live="polite">
      <div id="result">&nbsp;</div>
      <p class="round-summary">You played <span class="choice" id="myChoice">—</span>
        &nbsp;vs&nbsp; <span class="choice" id="botChoice">—</span> from the bot.</p>
    </section>

    <section class="controls">
      <h2>Choose wisely</h2>
      <div class="buttons">
        <button id="rock" aria-label="Play rock">
          <span class="emoji">✊</span><span class="label">Rock</span>
        </button>
        <button id="paper" aria-label="Play paper">
          <span class="emoji">✋</span><span class="label">Paper</span>
        </button>
        <button id="scissors" aria-label="Play scissors">
          <span class="emoji">✌️</span><span class="label">Scissors</span>
        </button>
      </div>
    </section>

    <footer></footer>
  </main>
  <script type="text/javascript" src="script.js"></script>
</body>
</html>
